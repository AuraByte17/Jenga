<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Jenga Aprimorado — Play + Builder</title>
<style>
  html,body{
    margin:0;padding:0;overflow:hidden;
    background:linear-gradient(180deg,#e6d0a8,#8a6d46);
    font-family:Inter,system-ui,Arial;
  }
  /* Evitar que gestos de navegação do browser interfiram com arrastar */
  #world{ touch-action:none; }
  #ui{
    position:absolute;left:12px;top:12px;z-index:10;
    background:rgba(0,0,0,.36);color:#fff;
    padding:10px;border-radius:10px;backdrop-filter:blur(4px)
  }
  #ui button{
    margin:4px;padding:8px 10px;border-radius:8px;
    border:none;background:#111;color:#fff;cursor:pointer
  }
  #ui .btnActive{background:#2eaa3a}
  #instructions{
    position:absolute;right:12px;top:12px;z-index:10;
    background:rgba(0,0,0,.36);padding:10px;border-radius:10px;
    color:#fff;max-width:320px;font-size:13px
  }
</style>
</head>
<body>
<canvas id="world"></canvas>

<div id="ui">
  <div>
    <button id="playMode" class="btnActive">Play</button>
    <button id="builderMode">Builder</button>
  </div>
  <div>
    <button id="resetBtn">Reiniciar</button>
    <button id="toggle3D">3D Simulado</button>
    <button id="testGravity">Test Gravity</button>
  </div>
  <div id="status" style="font-size:13px;margin-top:6px">A carregar...</div>
</div>

<div id="instructions">
  <b>Instruções</b>
  <ul>
    <li><b>Play:</b> arrasta ou clica para remover blocos.</li>
    <li><b>Builder:</b> arrasta blocos da pilha para construir.</li>
    <li>Botão “Test Gravity” aplica gravidade na construção.</li>
  </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
const { Engine, Render, Runner, World, Bodies, Body, Events, Mouse, MouseConstraint, Query } = Matter;

let engine, world, render, runner;
let blocks = [];
let staticWalls = [];
let mode = 'play';
let mode3D = false;
let gravityActive = false;

const ROWS = 8, BLOCKS_PER_ROW = 3, BLOCK_W = 120, BLOCK_H = 30, GAP = 2;
const DENSITY = 0.0028;

function init(){
  if(render){ Render.stop(render); Runner.stop(runner); render.canvas.remove(); }

  engine = Engine.create();
  world = engine.world;
  engine.gravity.y = 1;

  const canvas = document.getElementById('world');
  canvas.width = innerWidth; canvas.height = innerHeight;

  render = Render.create({
    canvas,
    engine,
    options:{ width:innerWidth, height:innerHeight, wireframes:false, background:'transparent' }
  });
  runner = Runner.create();

  createWalls();
  setupMouse();
  buildPlayTower();

  Runner.run(runner,engine);
  Render.run(render);
  status('Modo Play');
}

function createWalls(){
  staticWalls.forEach(w=>World.remove(world,w));
  const t=120;
  const ground=Bodies.rectangle(innerWidth/2,innerHeight+40,innerWidth*2,80,{isStatic:true});
  const left=Bodies.rectangle(-t/2,innerHeight/2,t,innerHeight*3,{isStatic:true});
  const right=Bodies.rectangle(innerWidth+t/2,innerHeight/2,t,innerHeight*3,{isStatic:true});
  staticWalls=[ground,left,right];
  World.add(world,staticWalls);
}

function buildPlayTower(){
  clearBlocks();
  const cx=innerWidth/2, baseY=innerHeight-120;
  for(let r=0;r<ROWS;r++){
    const horizontal=r%2===0;
    const y=baseY-r*(BLOCK_H+GAP);
    for(let i=0;i<BLOCKS_PER_ROW;i++){
      const x=horizontal
        ? cx-BLOCK_W+i*(BLOCK_W+GAP)
        : cx+(i-1)*(BLOCK_H+GAP);
      const w=horizontal?BLOCK_W:BLOCK_H;
      const h=horizontal?BLOCK_H:BLOCK_W;
      const b=Bodies.rectangle(x,y,w,h,{
        friction:0.9,frictionStatic:1,restitution:0,
        density:DENSITY,chamfer:{radius:4},
        render:{fillStyle:horizontal?'#d1a76a':'#b88546'}
      });
      blocks.push(b);
      World.add(world,b);
    }
  }
  for(let i=0;i<20;i++)Engine.update(engine,1000/60);
}

function buildBuilder(){
  clearBlocks();
  engine.gravity.y=0;
  const pileX=innerWidth-150;
  for(let i=0;i<24;i++){
    const horiz=i%2===0;
    const w=horiz?BLOCK_W:BLOCK_H;
    const h=horiz?BLOCK_H:BLOCK_W;
    const b=Bodies.rectangle(pileX,100+i*6,w,h,{
      friction:0.9,frictionStatic:1,density:DENSITY,
      chamfer:{radius:4},render:{fillStyle:horiz?'#d1a76a':'#b88546'}
    });
    blocks.push(b); World.add(world,b);
  }
  status('Modo Builder — arrasta peças e constrói!');
}

function setupMouse(){
  const mouse = Mouse.create(render.canvas);
  const mouseConstraint = MouseConstraint.create(engine, {
    mouse, constraint:{ stiffness:0.6, render:{ visible:false } }
  });
  World.add(world, mouseConstraint);
  render.mouse=mouse;

  // Click inteligente: remover bloco apenas em "click" (sem arrastar)
  let downInfo = { active:false, x:0, y:0, t:0 };
  const canvas = render.canvas;

  canvas.addEventListener('pointerdown', e=>{
    if(mode!=="play") return;
    if(e.pointerType==='mouse' && e.button!==0) return; // apenas botão principal no rato
    downInfo = { active:true, x:e.offsetX, y:e.offsetY, t:performance.now() };
  }, { passive:false });

  canvas.addEventListener('pointerup', e=>{
    if(!downInfo.active) return;
    const dt = performance.now() - downInfo.t;
    const dx = e.offsetX - downInfo.x, dy = e.offsetY - downInfo.y;
    const moved = Math.hypot(dx,dy) > 6;
    if(mode==='play' && !moved && dt < 220){
      const p={x:e.offsetX,y:e.offsetY};
      const found=Query.point(blocks,p);
      if(found.length){
        World.remove(world,found[0]);
        blocks = blocks.filter(b=>b!==found[0]);
      }
    }
    downInfo.active=false;
  }, { passive:false });
}

function toggle3D(){
  mode3D=!mode3D;
  document.getElementById('toggle3D').classList.toggle('btnActive',mode3D);
  blocks.forEach(b=>{
    const c=b.render.fillStyle;
    b.render.fillStyle=mode3D?shade(c,-15):c.startsWith('#')?c:'#d1a76a';
  });
}

function toggleGravity(){
  if(mode!=='builder')return;
  gravityActive=!gravityActive;
  engine.gravity.y=gravityActive?1:0;
  document.getElementById('testGravity').classList.toggle('btnActive',gravityActive);
  blocks.forEach(b=>b.isSleeping=false);
  status(gravityActive?'Gravidade ligada!':'Gravidade desligada.');
}

function clearBlocks(){ blocks.forEach(b=>World.remove(world,b)); blocks=[]; }

function shade(hex,percent){
  const f=parseInt(hex.slice(1),16),t=percent<0?0:255,p=Math.abs(percent)/100;
  const R=f>>16,G=f>>8&0x00FF,B=f&0x0000FF;
  return "#"+(0x1000000+
    (Math.round((t-R)*p)+R)*0x10000+
    (Math.round((t-G)*p)+G)*0x100+
    (Math.round((t-B)*p)+B)).toString(16).slice(1);
}

function status(msg){ document.getElementById('status').textContent=msg; }

// UI
document.getElementById('playMode').onclick=()=>{
  mode='play';engine.gravity.y=1;
  document.getElementById('playMode').classList.add('btnActive');
  document.getElementById('builderMode').classList.remove('btnActive');
  buildPlayTower();
};
document.getElementById('builderMode').onclick=()=>{
  mode='builder';
  document.getElementById('builderMode').classList.add('btnActive');
  document.getElementById('playMode').classList.remove('btnActive');
  buildBuilder();
};
document.getElementById('resetBtn').onclick=()=>{
  if(mode==='play')buildPlayTower(); else buildBuilder();
};
document.getElementById('toggle3D').onclick=toggle3D;
document.getElementById('testGravity').onclick=toggleGravity;

window.addEventListener('resize',init);
init();
</script>
</body>
</html>
